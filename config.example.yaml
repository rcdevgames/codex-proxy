# Copy this file to config.yaml and edit it.
#   cp config.example.yaml config.yaml
#   chmod 600 config.yaml
#
# Rules enforced by the binary at startup:
# - Only one YAML document; unknown keys are rejected.
# - The file must be a regular file with mode 0600 (no group/other access).
# - host must be loopback (127.0.0.1, localhost or ::1). Expose it publicly
#   only through a TLS reverse proxy (Caddy in this setup).
# - port must be 1-65535.
# - api_keys must contain at least one key; clients send it as
#   "Authorization: Bearer <key>".

# Address the bridge listens on. Keep this on loopback.
host: 127.0.0.1

# Port the bridge listens on. The public reverse proxy (Caddy) forwards to this port.
port: 8765

# Gateway API keys that clients must send. Generate a long random value, e.g.:
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
# Add one line per client to rotate keys without downtime; remove a line to revoke it.
# Real keys belong only in config.yaml, never in this example or in git.
api_keys:
  - "REPLACE_WITH_RANDOM_KEY_1"
  - "REPLACE_WITH_RANDOM_KEY_2"

# How often (seconds) the background check refreshes the upstream access token.
refresh_check_seconds: 60
